let tbDetailTid=null;

function renderTbTasks(){
  const list=document.getElementById('tbTaskList');
  const empty=document.getElementById('tbEmpty');
  const catMap={};CATEGORIES.forEach(c=>catMap[c.key]=c);

  // Build per-category filtered tasks (skip ★)
  const catCards=[];
  CATEGORIES.forEach(cat=>{
    if(cat.key==='★')return;
    // If category filter active, only show that category
    if(tbCatFilter!=='all'&&tbCatFilter!==cat.key)return;
    let tasks=tbTasks.filter(t=>t.cat===cat.key);
    // Apply status filter
    if(tbStatusFilter!=='all')tasks=tasks.filter(t=>t.status===tbStatusFilter);
    // Apply urgency/week filter
    if(tbFilter==='red')tasks=tasks.filter(t=>t.urgency==='red');
    if(tbFilter==='week'){
      const now=new Date();const weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);
      tasks=tasks.filter(t=>new Date(t.created)>=weekAgo);
    }
    // Apply search
    if(tbSearchQuery){const q=tbSearchQuery.toLowerCase();tasks=tasks.filter(t=>t.title.toLowerCase().includes(q))}
    // Hide card if filters active and no tasks match
    if((tbFilter!=='all'||tbStatusFilter!=='all'||tbSearchQuery)&&tasks.length===0)return;
    catCards.push({cat,tasks:sortTasks(tasks)});
  });

  if(catCards.length===0){list.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';

  // Render grid
  let html='<div class="tb-cat-grid">';
  catCards.forEach(({cat,tasks})=>{
    const allCatTasks=tbTasks.filter(t=>t.cat===cat.key);
    const doneCount=allCatTasks.filter(t=>t.status==='done').length;
    const totalCount=allCatTasks.length;
    const pct=totalCount?Math.round(doneCount/totalCount*100):0;
    html+='<div class="tb-cat-card" data-cat="'+cat.key+'">';
    html+='<div class="tb-cat-card-header"><span class="cat-icon">'+cat.icon+'</span>'+cat.label+'<span class="cat-task-count">'+tasks.length+'건</span></div>';
    html+='<div class="tb-cat-card-body" data-cat="'+cat.key+'">';
    if(tasks.length===0){
      html+='<div class="no-tasks">업무 없음</div>';
    } else {
      tasks.forEach(t=>{
        const isDone=t.status==='done';
        const urgDot=t.urgency==='red'?'🔴':t.urgency==='yellow'?'🟡':'🟢';
        const cbClass='tb-task-checkbox state-'+t.status;
        const cbChecked=t.status==='done'?' checked':'';
        html+='<div class="tb-cat-task urgency-'+t.urgency+(isDone?' done-task':'')+'" data-tid="'+t.id+'" draggable="true">';
        html+='<div class="tb-cat-task-row">';
        html+='<input type="checkbox" class="'+cbClass+'" data-tid="'+t.id+'"'+cbChecked+' title="'+TB_STATUS_LABEL[t.status]+'">';
        html+='<span class="tb-cat-task-status" data-tid="'+t.id+'" title="클릭하여 상태 변경">'+TB_STATUS_EMOJI[t.status]+'</span>';
        html+='<span class="tb-cat-task-title" data-tid="'+t.id+'" title="'+escapeHtml(t.title)+'">'+escapeHtml(t.title)+'</span>';
        html+='<span class="tb-cat-task-badges"><span class="urgency-dot">'+urgDot+'</span><span class="imp-badge">'+t.importance+'</span>'+(t.due?'<span class="due-badge">'+t.due+'</span>':'')+'</span>';
        html+='<button class="tb-cat-task-delete" data-tid="'+t.id+'" title="삭제">✕</button>';
        html+='</div>';
        html+='</div>';
      });
    }
    html+='</div>';
    // Progress bar
    html+='<div class="tb-cat-card-footer"><div class="tb-progress-wrap"><div class="tb-progress-bar"><div class="tb-progress-fill" style="width:'+pct+'%"></div></div><span class="tb-progress-text">'+doneCount+'/'+totalCount+' ('+pct+'%)</span></div></div>';
    html+='</div>';
  });
  html+='</div>';

  // ── Priority List ──
  const catMapPL={};CATEGORIES.forEach(c=>catMapPL[c.key]=c);
  let plTasks=tbTasks.filter(t=>t.status!=='done');
  // Apply same filters
  if(tbCatFilter!=='all')plTasks=plTasks.filter(t=>t.cat===tbCatFilter);
  if(tbStatusFilter!=='all'&&tbStatusFilter!=='done')plTasks=plTasks.filter(t=>t.status===tbStatusFilter);
  if(tbFilter==='red')plTasks=plTasks.filter(t=>t.urgency==='red');
  if(tbFilter==='week'){const now=new Date();const weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);plTasks=plTasks.filter(t=>new Date(t.created)>=weekAgo);}
  if(tbSearchQuery){const q=tbSearchQuery.toLowerCase();plTasks=plTasks.filter(t=>t.title.toLowerCase().includes(q));}
  // Sort by priorityOrder if any, otherwise urgency → importance
  const hasManualPriority=plTasks.some(t=>t.priorityOrder!==0);
  if(hasManualPriority){
    plTasks=plTasks.slice().sort((a,b)=>(a.priorityOrder||999)-(b.priorityOrder||999));
  } else {
    plTasks=plTasks.slice().sort((a,b)=>{
      const u=URGENCY_ORDER[a.urgency]-URGENCY_ORDER[b.urgency];
      if(u!==0)return u;
      const i=IMP_ORDER[a.importance]-IMP_ORDER[b.importance];
      if(i!==0)return i;
      return a.created<b.created?1:-1;
    });
  }
  if(plTasks.length>0){
    html+='<div class="tb-priority-section">';
    html+='<div class="tb-priority-title">🎯 우선순위 리스트</div>';
    html+='<div class="tb-priority-list">';
    plTasks.forEach((t,idx)=>{
      const urgDot=t.urgency==='red'?'🔴':t.urgency==='yellow'?'🟡':'🟢';
      const c=catMapPL[t.cat];
      const catLabel=c?c.icon+' '+c.key:'';
      html+='<div class="tb-priority-item" draggable="true" data-tid="'+t.id+'">';
      html+='<span class="tb-priority-drag-handle" title="드래그하여 순서 변경">≡</span>';
      html+='<span class="tb-priority-num">'+(idx+1)+'</span>';
      html+='<span class="tb-priority-urgency">'+urgDot+'</span>';
      html+='<span class="tb-priority-title-text" title="'+escapeHtml(t.title)+'">'+escapeHtml(t.title)+'</span>';
      html+='<span class="tb-priority-cat">'+catLabel+'</span>';
      html+='<span class="tb-priority-imp">'+t.importance+'</span>';
      html+='<span class="tb-priority-status" data-tid="'+t.id+'" title="클릭하여 상태 변경">'+TB_STATUS_EMOJI[t.status]+'</span>';
      html+='</div>';
    });
    html+='</div></div>';
  }

  list.innerHTML=html;

  // Set indeterminate state for "doing" checkboxes
  list.querySelectorAll('.tb-task-checkbox.state-doing').forEach(cb=>{cb.indeterminate=true;cb.checked=false});

  // ── Events ──
  // Priority list status toggle
  list.querySelectorAll('.tb-priority-status').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const task=tbTasks.find(t=>t.id===el.dataset.tid);
    if(!task)return;
    const idx=TB_STATUS_CYCLE.indexOf(task.status);
    task.status=TB_STATUS_CYCLE[(idx+1)%TB_STATUS_CYCLE.length];
    saveTasks();renderTbAll();
  });
  // Priority list title click → open detail panel
  list.querySelectorAll('.tb-priority-title-text').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const item=el.closest('.tb-priority-item');
    if(item)openDetailPanel(item.dataset.tid);
  });
  // Checkbox status cycle (대기→진행중→완료)
  list.querySelectorAll('.tb-task-checkbox').forEach(cb=>{
    cb.onclick=e=>{
      e.stopPropagation();
      e.preventDefault();
      const task=tbTasks.find(t=>t.id===cb.dataset.tid);
      if(!task)return;
      const idx=TB_STATUS_CYCLE.indexOf(task.status);
      task.status=TB_STATUS_CYCLE[(idx+1)%TB_STATUS_CYCLE.length];
      saveTasks();renderTbAll();
    };
  });
  // Status emoji toggle
  list.querySelectorAll('.tb-cat-task-status').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const task=tbTasks.find(t=>t.id===el.dataset.tid);
    if(!task)return;
    const idx=TB_STATUS_CYCLE.indexOf(task.status);
    task.status=TB_STATUS_CYCLE[(idx+1)%TB_STATUS_CYCLE.length];
    saveTasks();renderTbAll();
  });
  // Delete (with confirm)
  list.querySelectorAll('.tb-cat-task-delete').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    if(!confirm('정말 삭제하시겠습니까?'))return;
    tbTasks=tbTasks.filter(t=>t.id!==el.dataset.tid);
    closeDetailPanel();
    saveTasks();renderTbAll();
  });
  // Task title click → open detail panel
  list.querySelectorAll('.tb-cat-task-title').forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      openDetailPanel(el.dataset.tid);
    };
  });

  // ── Priority List Drag & Drop ──
  let plDragTid=null;
  function removePriorityIndicators(){list.querySelectorAll('.tb-priority-drop-indicator').forEach(el=>el.remove());list.querySelectorAll('.tb-priority-item.dragging').forEach(el=>el.classList.remove('dragging'))}
  list.querySelectorAll('.tb-priority-item').forEach(item=>{
    item.setAttribute('draggable','false');
    item.querySelector('.tb-priority-drag-handle')?.addEventListener('mousedown',()=>{item.setAttribute('draggable','true')});
    item.addEventListener('dragstart',e=>{
      plDragTid=item.dataset.tid;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',plDragTid);
      requestAnimationFrame(()=>item.classList.add('dragging'));
    });
    item.addEventListener('dragend',()=>{
      item.classList.remove('dragging');
      item.setAttribute('draggable','false');
      plDragTid=null;
      removePriorityIndicators();
    });
    item.addEventListener('dragover',e=>{
      if(!plDragTid)return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      removePriorityIndicators();
      const rect=item.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      const indicator=document.createElement('div');
      indicator.className='tb-priority-drop-indicator';
      if(e.clientY<midY){
        item.parentNode.insertBefore(indicator,item);
      } else {
        item.parentNode.insertBefore(indicator,item.nextSibling);
      }
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();
      e.stopPropagation();
      if(!plDragTid||plDragTid===item.dataset.tid){removePriorityIndicators();return}
      const dragTask=tbTasks.find(t=>t.id===plDragTid);
      if(!dragTask){removePriorityIndicators();return}
      // Get all priority items in current DOM order
      const plItems=Array.from(list.querySelectorAll('.tb-priority-item[data-tid]'));
      const plIds=plItems.map(el=>el.dataset.tid).filter(id=>id!==plDragTid);
      const targetIdx=plIds.indexOf(item.dataset.tid);
      const rect=item.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      const insertIdx=e.clientY<midY?targetIdx:targetIdx+1;
      plIds.splice(insertIdx,0,plDragTid);
      // Update priorityOrder for all tasks in the list
      plIds.forEach((id,i)=>{
        const t=tbTasks.find(tk=>tk.id===id);
        if(t)t.priorityOrder=i+1;
      });
      removePriorityIndicators();
      saveTasks();renderTbAll();
    });
  });

  // ── Drag & Drop ──
  let dragTid=null;
  function removeDropIndicators(){list.querySelectorAll('.tb-drop-indicator').forEach(el=>el.remove());list.querySelectorAll('.tb-cat-card.drag-over').forEach(el=>el.classList.remove('drag-over'))}

  list.querySelectorAll('.tb-cat-task').forEach(taskEl=>{
    taskEl.addEventListener('dragstart',e=>{
      dragTid=taskEl.dataset.tid;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragTid);
      requestAnimationFrame(()=>taskEl.classList.add('dragging'));
    });
    taskEl.addEventListener('dragend',()=>{
      taskEl.classList.remove('dragging');
      dragTid=null;
      removeDropIndicators();
    });
    taskEl.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      removeDropIndicators();
      const card=taskEl.closest('.tb-cat-card');
      if(card)card.classList.add('drag-over');
      const rect=taskEl.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      const indicator=document.createElement('div');
      indicator.className='tb-drop-indicator';
      if(e.clientY<midY){
        taskEl.parentNode.insertBefore(indicator,taskEl);
      } else {
        taskEl.parentNode.insertBefore(indicator,taskEl.nextSibling);
      }
    });
    taskEl.addEventListener('drop',e=>{
      e.preventDefault();
      e.stopPropagation();
      if(!dragTid||dragTid===taskEl.dataset.tid){removeDropIndicators();return}
      const targetCat=taskEl.closest('.tb-cat-card-body')?.dataset.cat;
      if(!targetCat){removeDropIndicators();return}
      const dragTask=tbTasks.find(t=>t.id===dragTid);
      if(!dragTask){removeDropIndicators();return}
      // Change category if needed
      dragTask.cat=targetCat;
      // Determine insertion position
      const rect=taskEl.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      const insertBefore=e.clientY<midY;
      // Get current category tasks in DOM order, rebuild sortOrder
      const catTasks=tbTasks.filter(t=>t.cat===targetCat&&t.id!==dragTid);
      const targetIdx=catTasks.findIndex(t=>t.id===taskEl.dataset.tid);
      const insertIdx=insertBefore?targetIdx:targetIdx+1;
      catTasks.splice(insertIdx,0,dragTask);
      catTasks.forEach((t,i)=>t.sortOrder=i+1);
      removeDropIndicators();
      saveTasks();renderTbAll();
    });
  });

  // Allow drop on empty card bodies
  list.querySelectorAll('.tb-cat-card-body').forEach(body=>{
    body.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const card=body.closest('.tb-cat-card');
      if(card){removeDropIndicators();card.classList.add('drag-over')}
    });
    body.addEventListener('dragleave',e=>{
      if(!body.contains(e.relatedTarget)){
        const card=body.closest('.tb-cat-card');
        if(card)card.classList.remove('drag-over');
      }
    });
    body.addEventListener('drop',e=>{
      e.preventDefault();
      if(!dragTid)return;
      const targetCat=body.dataset.cat;
      const dragTask=tbTasks.find(t=>t.id===dragTid);
      if(!dragTask||!targetCat){removeDropIndicators();return}
      dragTask.cat=targetCat;
      // Append to end of category
      const catTasks=tbTasks.filter(t=>t.cat===targetCat);
      const maxOrder=catTasks.reduce((m,t)=>Math.max(m,t.sortOrder||0),0);
      dragTask.sortOrder=maxOrder+1;
      // Reassign all sortOrders for this category
      const sorted=tbTasks.filter(t=>t.cat===targetCat);
      sorted.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
      sorted.forEach((t,i)=>t.sortOrder=i+1);
      removeDropIndicators();
      saveTasks();renderTbAll();
    });
  });
}

    html+='<div class="tb-detail-checklist-item'+(ci.done?' checked':'')+'" data-ci="'+idx+'">';
    html+='<input type="checkbox"'+(ci.done?' checked':'')+' data-ci="'+idx+'">';

  document.getElementById('dpDue').onchange=e=>{task.due=e.target.value||null;saveTasks();renderTbAll()};
  document.getElementById('dpDesc').onblur=e=>{task.desc=e.target.value.trim();saveTasks();renderTbAll()};
  document.getElementById('dpMemo').onblur=e=>{task.memo=e.target.value.trim();saveTasks();renderTbAll()};

  body.querySelectorAll('.tb-detail-checklist-item input[type="checkbox"]').forEach(cb=>cb.onchange=()=>{

    saveTasks();renderDetailBody(task);renderTbAll();
  });
  // Checklist delete
  body.querySelectorAll('.cl-delete').forEach(btn=>btn.onclick=()=>{
    task.checklist.splice(parseInt(btn.dataset.ci),1);
    saveTasks();renderDetailBody(task);renderTbAll();
  });

  const clAddBtn=document.getElementById('dpClAddBtn');
  const clAddInput=document.getElementById('dpClAdd');
  const addClItem=()=>{

    if(!text)return;

    task.checklist.push({text,done:false});
    saveTasks();renderDetailBody(task);renderTbAll();
  };
  clAddBtn.onclick=addClItem;
  clAddInput.onkeydown=e=>{if(e.key==='Enter')addClItem()};

      });
    };
  });

function addTask(){
  const title=document.getElementById('tbNewTitle').value.trim();
  if(!title)return;
  const task={
    id:'t'+Date.now(),
    title:title,
    cat:document.getElementById('tbNewCat').value,
    urgency:document.getElementById('tbNewUrgency').value,
    importance:document.getElementById('tbNewImp').value,
    status:'waiting',
    created:new Date().toISOString().slice(0,10),
    due:document.getElementById('tbNewDue').value||null,
    checklist:[],assignee:'',memo:'',desc:'',priorityOrder:0,_source:'local'
  };
  tbTasks.unshift(task);
  saveTasks();
  document.getElementById('tbNewTitle').value='';
  document.getElementById('tbNewDue').value='';
  document.getElementById('tbAddForm').classList.remove('open');
  renderTbAll();
}

function switchTab(tabId){
  document.querySelectorAll('.tb-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabId));
  document.querySelectorAll('.tb-tab-panel').forEach(p=>p.classList.remove('active'));
  const panelMap={my:'tabMy',agents:'tabAgents',gantt:'tabGantt'};
  const panel=document.getElementById(panelMap[tabId]||'tabMy');
  if(panel)panel.classList.add('active');
  localStorage.setItem(TB_TAB_STORAGE,tabId);
  if(tabId==='agents')renderAgentBoard();
  if(tabId==='gantt')renderGanttChart();
}

/* ═══════ Gantt Chart ═══════ */
const GANTT_CAT_COLORS={'A':'#3b82f6','B':'#ec4899','C':'#6b7280','D':'#f59e0b','E':'#10b981','F':'#eab308','G':'#8b5cf6','H':'#6366f1','I':'#6366f1','J':'#14b8a6','K':'#ef4444','Z':'#a855f7','★':'#002855'};
let ganttCatFilter='all';
function renderGanttChart(){
  const filterBar=document.getElementById('ganttFilterBar');
  const container=document.getElementById('ganttContainer');
  if(!filterBar||!container)return;
  // Filter chips
  const catMap=Object.fromEntries(CATEGORIES.map(c=>[c.key,c]));
  const usedCats=[...new Set(tbTasks.map(t=>t.cat))];
  let fhtml='<button class="tb-filter-chip'+(ganttCatFilter==='all'?' active':'')+'" data-cat="all">전체</button>';
  usedCats.forEach(k=>{const c=catMap[k];if(c)fhtml+='<button class="tb-filter-chip'+(ganttCatFilter===k?' active':'')+'" data-cat="'+k+'">'+c.icon+' '+c.key+'</button>'});
  filterBar.innerHTML=fhtml;
  filterBar.querySelectorAll('.tb-filter-chip').forEach(btn=>btn.onclick=()=>{ganttCatFilter=btn.dataset.cat;renderGanttChart()});

  // Filter tasks
  let tasks=tbTasks.slice();
  if(ganttCatFilter!=='all')tasks=tasks.filter(t=>t.cat===ganttCatFilter);
  if(tasks.length===0){container.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-secondary)">표시할 업무가 없습니다.</div>';return}

  // Parse dates
  const DAY_PX=40;
  const DOW_KR=['일','월','화','수','목','금','토'];
  const today=new Date();today.setHours(0,0,0,0);
  const parseDate=s=>{if(!s)return null;const d=new Date(s);d.setHours(0,0,0,0);return isNaN(d)?null:d};
  const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
  const diffDays=(a,b)=>Math.round((a-b)/(86400000));

  // Compute start/end for each task
  const taskData=tasks.map(t=>{
    let start=parseDate(t.created)||today;
    let end=parseDate(t.due);
    if(!end)end=addDays(start,7);
    if(end<start)end=addDays(start,1);
    return{task:t,start,end};
  });

  // Timeline range: min start - 3 days to max end + 3 days, at least ±14 days from today
  let minDate=new Date(Math.min(...taskData.map(d=>d.start.getTime()),today.getTime()));
  let maxDate=new Date(Math.max(...taskData.map(d=>d.end.getTime()),today.getTime()));
  minDate=addDays(minDate,-3);maxDate=addDays(maxDate,3);
  const twoWeeksBefore=addDays(today,-14);
  const twoWeeksAfter=addDays(today,14);
  if(minDate>twoWeeksBefore)minDate=twoWeeksBefore;
  if(maxDate<twoWeeksAfter)maxDate=twoWeeksAfter;

  const totalDays=diffDays(maxDate,minDate)+1;
  const timelineWidth=totalDays*DAY_PX;
  const todayOffset=diffDays(today,minDate);

  // Build HTML
  let h='<div class="gantt-wrapper">';
  // Left labels
  h+='<div class="gantt-labels"><div class="gantt-labels-header">업무</div>';
  taskData.forEach(d=>{
    const isDone=d.task.status==='done';
    h+='<div class="gantt-label-row'+(isDone?' done-row':'')+'" data-tid="'+d.task.id+'" title="'+escapeHtml(d.task.title)+'">'+escapeHtml(d.task.title)+'</div>';
  });
  h+='</div>';

  // Timeline
  h+='<div class="gantt-timeline" style="width:'+timelineWidth+'px">';
  // Date header
  h+='<div class="gantt-date-header">';
  for(let i=0;i<totalDays;i++){
    const d=addDays(minDate,i);
    const dow=d.getDay();
    const isWeekend=dow===0||dow===6;
    const isToday=diffDays(d,today)===0;
    h+='<div class="gantt-date-cell'+(isWeekend?' weekend':'')+(isToday?' today':'')+'">';
    h+='<span class="gantt-date-day">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>';
    h+='<span class="gantt-date-dow">'+DOW_KR[dow]+'</span>';
    h+='</div>';
  }
  h+='</div>';

  // Rows
  h+='<div class="gantt-rows">';
  taskData.forEach((d,ri)=>{
    h+='<div class="gantt-row">';
    // Background cells
    h+='<div class="gantt-row-bg">';
    for(let i=0;i<totalDays;i++){
      const dt=addDays(minDate,i);const dow=dt.getDay();
      h+='<div class="gantt-row-cell'+(dow===0||dow===6?' weekend':'')+'"></div>';
    }
    h+='</div>';
    // Bar
    const left=diffDays(d.start,minDate)*DAY_PX;
    const width=Math.max((diffDays(d.end,d.start)+1)*DAY_PX,DAY_PX);
    const color=GANTT_CAT_COLORS[d.task.cat]||'#6b7280';
    const statusCls=d.task.status==='done'?' status-done':d.task.status==='waiting'?' status-waiting':'';
    h+='<div class="gantt-bar'+statusCls+'" data-tid="'+d.task.id+'" style="left:'+left+'px;width:'+width+'px;background:'+color+'">';
    h+='<span class="gantt-bar-text">'+escapeHtml(d.task.title)+'</span>';
    h+='</div>';
    h+='</div>';
  });

  // Today line
  if(todayOffset>=0&&todayOffset<totalDays){
    h+='<div class="gantt-today-line" style="left:'+(todayOffset*DAY_PX+DAY_PX/2)+'px"></div>';
  }
  h+='</div></div></div>';

  // Tooltip element
  h+='<div class="gantt-tooltip" id="ganttTooltip"></div>';
  container.innerHTML=h;

  // Scroll to today
  const timeline=container.querySelector('.gantt-timeline');
  if(timeline&&todayOffset>5)container.scrollLeft=(todayOffset-5)*DAY_PX;

  // Events: label click → detail panel
  container.querySelectorAll('.gantt-label-row').forEach(el=>el.onclick=()=>openDetailPanel(el.dataset.tid));

  // Events: bar hover → tooltip
  const tooltip=document.getElementById('ganttTooltip');
  container.querySelectorAll('.gantt-bar').forEach(bar=>{
    bar.onmouseenter=e=>{
      const t=tbTasks.find(x=>x.id===bar.dataset.tid);if(!t)return;
      const c=catMap[t.cat];
      tooltip.innerHTML='<div class="gt-title">'+escapeHtml(t.title)+'</div>'
        +'<div class="gt-row"><span class="gt-label">카테고리</span>'+(c?c.icon+' '+c.label:'')+'</div>'
        +'<div class="gt-row"><span class="gt-label">기간</span>'+(t.created||'?')+' ~ '+(t.due||'미정')+'</div>'
        +'<div class="gt-row"><span class="gt-label">상태</span>'+TB_STATUS_EMOJI[t.status]+' '+TB_STATUS_LABEL[t.status]+'</div>';
      tooltip.style.display='block';
    };
    bar.onmousemove=e=>{
      tooltip.style.left=(e.clientX+12)+'px';
      tooltip.style.top=(e.clientY+12)+'px';
    };
    bar.onmouseleave=()=>{tooltip.style.display='none'};
  });

  // Events: bar click → detail panel
  container.querySelectorAll('.gantt-bar').forEach(bar=>bar.onclick=()=>openDetailPanel(bar.dataset.tid));
}

/* ═══════ Agent Board Logic ═══════ */
const AB_STORAGE='tenex-agent-board-v1';
const AB_STATUS_EMOJI={doing:'🔧',done:'✅',delay:'🔴',waiting:'⏳'};
const AB_STATUS_CYCLE=['doing','done','delay','waiting'];
const DEFAULT_AGENT_TASKS=[
  {id:'개실장',icon:'🔧',name:'개실장',role:'개발실 총괄',tasks:[
    {id:'g1',name:'업무보드 SPA 구현',status:'doing'},
    {id:'g2',name:'almani 계정 + 어드민 페이지',status:'done'},
    {id:'g3',name:'tenex-reports UI 리뉴얼',status:'done'},
    {id:'g4',name:'정품등록 시스템',status:'doing'},
    {id:'g5',name:'앱 MVP 기술 스펙',status:'doing'},
  ]},
  {id:'마실장',icon:'📣',name:'마실장',role:'마케팅실 총괄',tasks:[
    {id:'m1',name:'Mixpanel 시각화 대시보드',status:'doing'},
    {id:'m2',name:'메타 광고 성과 리포트',status:'doing'},
    {id:'m3',name:'CRM 알림톡 자동화',status:'waiting'},
    {id:'m4',name:'인플루언서 아웃리치',status:'waiting'},
  ]},
  {id:'고실장',icon:'🎯',name:'고실장',role:'고객성공 총괄',tasks:[
    {id:'k1',name:'CS 운영 기획안',status:'delay'},
    {id:'k2',name:'VOC 분석 리포트',status:'doing'},
    {id:'k3',name:'체험단 리뷰 관리',status:'waiting'},
  ]},
  {id:'콘실장',icon:'🎬',name:'콘실장',role:'콘텐츠 총괄',tasks:[
    {id:'c1',name:'YouTube 댓글 자동화',status:'doing'},
    {id:'c2',name:'콘텐츠 캘린더 수립',status:'doing'},
    {id:'c3',name:'썸네일 A/B 테스트',status:'waiting'},
  ]},
];

let agentData=[];
async function loadAgentDataFromJson(){
  try{
    const res=await fetch('/data/project-status.json');
    if(!res.ok)throw new Error('fetch failed');
    const json=await res.json();
    const jsonAgents=json.agents.map(a=>({...a,tasks:a.tasks.map(t=>({...t,status:JSON_STATUS_MAP[t.status]||t.status}))}));
    const jsonById=new Map(jsonAgents.map(a=>[a.id,a]));
    let localAgents=[];
    try{
      const saved=localStorage.getItem(AB_STORAGE);
      if(saved)localAgents=JSON.parse(saved);
    }catch(e){}
    if(localAgents.length===0){
      agentData=jsonAgents;saveAgentData();return;
    }
    // Merge: JSON agents data wins, keep local-only agents
    const merged=[];
    const localById=new Map(localAgents.map(a=>[a.id,a]));
    jsonAgents.forEach(ja=>{
      merged.push(ja);
    });
    localAgents.forEach(la=>{
      if(!jsonById.has(la.id)){
        merged.push(la);
      }
    });
    agentData=merged;saveAgentData();
  }catch(e){
    try{
      const saved=localStorage.getItem(AB_STORAGE);
      if(saved){agentData=JSON.parse(saved);return}
    }catch(e2){}
    agentData=DEFAULT_AGENT_TASKS.map(a=>({...a,tasks:a.tasks.map(t=>({...t}))}));
    saveAgentData();
  }
}
function saveAgentData(){localStorage.setItem(AB_STORAGE,JSON.stringify(agentData))}

function renderAgentBoard(){
  const grid=document.getElementById('agentGrid');
  grid.innerHTML=agentData.map(agent=>{
    const doing=agent.tasks.filter(t=>t.status==='doing').length;
    const done=agent.tasks.filter(t=>t.status==='done').length;
    const delay=agent.tasks.filter(t=>t.status==='delay').length;
    const taskHtml=agent.tasks.map(t=>{
      const cls=t.status==='done'?' done':t.status==='delay'?' delay':'';
      return '<li class="agent-task-item'+cls+'">'+
        '<span class="agent-task-status" data-agent="'+agent.id+'" data-task="'+t.id+'">'+AB_STATUS_EMOJI[t.status]+'</span>'+
        '<span class="agent-task-name">'+escapeHtml(t.name)+'</span>'+
        '<button class="tc-delete" data-agent="'+agent.id+'" data-task="'+t.id+'" title="삭제" style="opacity:0;border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;transition:all .15s">✕</button>'+
      '</li>';
    }).join('');
    return '<div class="agent-card">'+
      '<div class="agent-card-header">'+
        '<span class="agent-card-icon">'+agent.icon+'</span>'+
        '<div class="agent-card-info"><h3>'+agent.name+'</h3><span class="agent-role">'+agent.role+'</span></div>'+
        '<div class="agent-card-stats">'+
          (doing?'<span style="background:rgba(234,179,8,0.15);color:#b45309">🔧'+doing+'</span>':'')+
          (done?'<span style="background:rgba(34,197,94,0.15);color:#15803d">✅'+done+'</span>':'')+
          (delay?'<span style="background:rgba(239,68,68,0.15);color:#dc2626">🔴'+delay+'</span>':'')+
        '</div>'+
      '</div>'+
      '<ul class="agent-task-list">'+taskHtml+'</ul>'+
      '<div class="agent-add-wrap">'+
        '<input class="agent-add-input" type="text" placeholder="새 업무 추가..." data-agent="'+agent.id+'">'+
        '<button class="agent-add-btn" data-agent="'+agent.id+'">+ 추가</button>'+
      '</div>'+
    '</div>';
  }).join('');
  // Status toggle
  grid.querySelectorAll('.agent-task-status').forEach(el=>el.onclick=()=>{
    const agent=agentData.find(a=>a.id===el.dataset.agent);
    if(!agent)return;
    const task=agent.tasks.find(t=>t.id===el.dataset.task);
    if(!task)return;
    const idx=AB_STATUS_CYCLE.indexOf(task.status);
    task.status=AB_STATUS_CYCLE[(idx+1)%AB_STATUS_CYCLE.length];
    saveAgentData();renderAgentBoard();
  });
  // Delete
  grid.querySelectorAll('.tc-delete[data-agent]').forEach(el=>{
    el.parentElement.onmouseenter=()=>el.style.opacity='.6';
    el.parentElement.onmouseleave=()=>el.style.opacity='0';
    el.onclick=e=>{
      e.stopPropagation();
      if(!confirm('정말 삭제하시겠습니까?'))return;
      const agent=agentData.find(a=>a.id===el.dataset.agent);
      if(!agent)return;
      agent.tasks=agent.tasks.filter(t=>t.id!==el.dataset.task);
      saveAgentData();renderAgentBoard();
    };
  });
  // Add task
  grid.querySelectorAll('.agent-add-btn').forEach(btn=>{
    const input=grid.querySelector('.agent-add-input[data-agent="'+btn.dataset.agent+'"]');
    const doAdd=()=>{
      const name=input.value.trim();
      if(!name)return;
      const agent=agentData.find(a=>a.id===btn.dataset.agent);
      if(!agent)return;
      agent.tasks.push({id:'a'+Date.now(),name:name,status:'doing'});
      saveAgentData();renderAgentBoard();
    };
    btn.onclick=doAdd;
    input.onkeydown=e=>{if(e.key==='Enter')doAdd()};
  });
}
