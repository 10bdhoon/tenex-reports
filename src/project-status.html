<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>프로젝트 현황 — 테넥스</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1a1a2e;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.header h1{font-size:20px;font-weight:700}
.header a{color:#8b8ba7;font-size:13px;text-decoration:none;margin-left:auto}
.header a:hover{color:#fff}
.content{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
.section-title{font-size:15px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;margin-top:36px}
.section-title:first-of-type{margin-top:0}

/* 실장 카드 그리드 */
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:8px}
.agent-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;transition:all .2s}
.agent-card:hover{border-color:#002855;box-shadow:0 4px 16px rgba(0,40,85,0.3)}
.agent-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.agent-icon{font-size:22px}
.agent-name{font-size:15px;font-weight:700;color:#f1f5f9}
.agent-role{font-size:11px;color:#64748b;margin-top:2px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f172a;border-radius:8px;cursor:pointer;transition:background .15s;user-select:none}
.task-item:hover{background:#1e3a5f}
.task-status{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.task-name{font-size:13px;color:#cbd5e1;flex:1}
.task-item.done .task-name{text-decoration:line-through;color:#475569}
.task-item.delay .task-name{color:#fca5a5}

/* 액션 체크리스트 */
.action-list{display:flex;flex-direction:column;gap:6px}
.action-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1e293b;border:1px solid #334155;border-radius:10px;cursor:pointer;transition:all .15s;user-select:none}
.action-item:hover{border-color:#002855;background:#1e3a5f}
.action-num{font-size:12px;font-weight:700;color:#64748b;min-width:24px}
.action-status{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.action-text{font-size:14px;color:#cbd5e1;flex:1}
.action-item.done .action-text{text-decoration:line-through;color:#475569}
.action-item.delay .action-text{color:#fca5a5}

/* 상태 드롭다운 */
.status-wrap{position:relative}
.status-dd{position:absolute;right:0;top:calc(100% + 4px);background:#1e293b;border:1px solid #475569;border-radius:8px;z-index:100;min-width:120px;padding:4px 0;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.status-dd-item{padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:8px}
.status-dd-item:hover{background:#334155}

.legend{display:flex;gap:20px;margin-top:20px;padding:12px 16px;background:#1e293b;border-radius:8px;font-size:12px;color:#94a3b8}
.legend span{display:flex;align-items:center;gap:6px}

.last-saved{font-size:11px;color:#475569;margin-top:20px;text-align:right}
</style>
</head>
<body>
<div class="header">
  <h1>📋 프로젝트 현황</h1>
  <span style="font-size:12px;color:#64748b;margin-left:8px">상태 클릭으로 변경 · localStorage 자동 저장</span>
  <a href="/index.html">← 보고서 목록</a>
</div>

<div class="content">

<div class="section-title">🤖 실장 업무 현황</div>
<div class="agent-grid" id="agentGrid"></div>

<div class="section-title">✅ 태훈 액션 아이템</div>
<div class="action-list" id="actionList"></div>

<div class="legend">
  <span>🔧 진행중</span>
  <span>✅ 완료</span>
  <span>🔴 지연</span>
  <span>⏳ 대기</span>
</div>
<div class="last-saved" id="lastSaved"></div>

</div>

<script>
const STORAGE_KEY = 'tenex-project-status-v1';
const API_READ = '/api/tasks/read';
const API_UPDATE = '/api/tasks/update';

// ── 폴백 데이터 (API 실패 시) ──
const FALLBACK_AGENTS = [
  {id:'개실장', icon:'🔧', name:'개실장', role:'개발실 총괄', tasks:[
    {id:'a1', name:'모사모 강의 통합', status:'done'},
    {id:'a2', name:'앱 탭 UI 통합', status:'doing'},
    {id:'a3', name:'SPA 카테고리 구조', status:'doing'},
    {id:'a4', name:'정품등록 + 메타픽셀', status:'doing'},
    {id:'a5', name:'tenex-reports UI 리뉴얼', status:'done'},
  ]},
  {id:'마실장', icon:'📣', name:'마실장', role:'마케팅실 총괄', tasks:[
    {id:'b1', name:'Mixpanel 시각화 대시보드', status:'doing'},
    {id:'b2', name:'메타 광고 성과 리포트', status:'waiting'},
    {id:'b3', name:'CRM 알림톡 자동화', status:'waiting'},
  ]},
  {id:'고실장', icon:'🎯', name:'고실장', role:'고객성공 총괄', tasks:[
    {id:'c1', name:'CS 기획안', status:'delay'},
    {id:'c2', name:'VOC 분석 리포트', status:'waiting'},
  ]},
  {id:'콘실장', icon:'🎬', name:'콘실장', role:'콘텐츠 총괄', tasks:[
    {id:'d1', name:'YouTube 댓글 자동화', status:'doing'},
    {id:'d2', name:'콘텐츠 기획 캘린더', status:'waiting'},
  ]},
];

const FALLBACK_ACTIONS = [
  {id:'t1', num:1, text:'리포트 UI 크롱 스타일 전환', status:'done'},
  {id:'t2', num:2, text:'지메일 연동', status:'waiting'},
  {id:'t3', num:3, text:'알림톡 CRM (알마니 대표 소개 후)', status:'waiting'},
  {id:'t4', num:4, text:'정품등록 + 메타픽셀', status:'doing'},
  {id:'t5', num:5, text:'Mixpanel 시각화', status:'waiting'},
  {id:'t6', num:6, text:'앱 MVP 개발 착수', status:'waiting'},
  {id:'t7', num:7, text:'CS-25 리뷰 체험단 세팅', status:'waiting'},
  {id:'t8', num:8, text:'유튜브 콘텐츠 캘린더', status:'waiting'},
  {id:'t9', num:9, text:'팀 채용 JD 작성', status:'waiting'},
  {id:'t10', num:10, text:'해외진출 1차 리서치', status:'waiting'},
];

const STATUS_EMOJI = {done:'✅', doing:'🔧', delay:'🔴', waiting:'⏳', pending:'⏳'};
const STATUS_CYCLE = ['doing','done','delay','waiting'];

let agents = [];
let actions = [];
let dataSource = 'loading'; // 'api' | 'local' | 'fallback'

// ── 데이터 로드 (API → localStorage → 폴백) ──
async function loadData() {
  try {
    const resp = await fetch(API_READ);
    if (resp.ok) {
      const data = await resp.json();
      if (data.agents && data.agents.length > 0) {
        agents = data.agents;
        // tasks → actions (태훈 액션 아이템은 DB의 tasks 중 assignee='태훈')
        actions = FALLBACK_ACTIONS; // 액션 아이템은 별도 관리 유지
        dataSource = 'api';
        console.log('✅ Supabase에서 로드:', agents.length, 'agents');
        return;
      }
    }
  } catch (e) {
    console.warn('API 로드 실패, 로컬 폴백:', e);
  }

  // localStorage 폴백
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.agents) {
      agents = FALLBACK_AGENTS.map(a => ({
        ...a,
        tasks: a.tasks.map(t => ({...t, status: saved.tasks?.[t.id] || t.status}))
      }));
      actions = FALLBACK_ACTIONS.map(a => ({...a, status: saved.actions?.[a.id] || a.status}));
      dataSource = 'local';
      return;
    }
  } catch {}

  agents = FALLBACK_AGENTS;
  actions = FALLBACK_ACTIONS;
  dataSource = 'fallback';
}

// ── 저장 (API + localStorage) ──
let saveTimer = null;
function saveData() {
  // localStorage에 즉시 저장 (오프라인 대비)
  const taskMap = {};
  agents.forEach(a => a.tasks.forEach(t => { taskMap[t.id] = t.status; }));
  const actMap = {};
  actions.forEach(a => { actMap[a.id] = a.status; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks: taskMap, actions: actMap, agents}));

  // API 저장은 디바운스 (300ms)
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const resp = await fetch(API_UPDATE, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({tasks: [], agents})
      });
      if (resp.ok) {
        updateSaveStatus('DB 저장 완료');
      } else {
        updateSaveStatus('DB 저장 실패 (로컬에 저장됨)');
      }
    } catch {
      updateSaveStatus('오프라인 — 로컬에 저장됨');
    }
  }, 300);

  updateSaveStatus('저장 중...');
}

function updateSaveStatus(msg) {
  const el = document.getElementById('lastSaved');
  el.textContent = msg + ' · ' + new Date().toLocaleString('ko-KR');
}

function cycleStatus(current) {
  const idx = STATUS_CYCLE.indexOf(current);
  return STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
}

function renderAgents() {
  const grid = document.getElementById('agentGrid');
  grid.innerHTML = agents.map(agent => `
    <div class="agent-card">
      <div class="agent-header">
        <span class="agent-icon">${agent.icon}</span>
        <div>
          <div class="agent-name">${agent.name}</div>
          <div class="agent-role">${agent.role}</div>
        </div>
      </div>
      <div class="task-list">
        ${agent.tasks.map(task => `
          <div class="task-item ${task.status === 'done' ? 'done' : task.status === 'delay' ? 'delay' : ''}"
               onclick="toggleTask('${agent.id}','${task.id}')" title="클릭하여 상태 변경">
            <span class="task-status">${STATUS_EMOJI[task.status] || '⏳'}</span>
            <span class="task-name">${task.name}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderActions() {
  const list = document.getElementById('actionList');
  list.innerHTML = actions.map(a => `
    <div class="action-item ${a.status === 'done' ? 'done' : a.status === 'delay' ? 'delay' : ''}"
         onclick="toggleAction('${a.id}')" title="클릭하여 상태 변경">
      <span class="action-num">${a.num}</span>
      <span class="action-status">${STATUS_EMOJI[a.status] || '⏳'}</span>
      <span class="action-text">${a.text}</span>
    </div>
  `).join('');
}

function toggleTask(agentId, taskId) {
  agents = agents.map(a => a.id === agentId ? {
    ...a,
    tasks: a.tasks.map(t => t.id === taskId ? {...t, status: cycleStatus(t.status)} : t)
  } : a);
  saveData();
  renderAgents();
}

function toggleAction(actionId) {
  actions = actions.map(a => a.id === actionId ? {...a, status: cycleStatus(a.status)} : a);
  saveData();
  renderActions();
}

// ── 초기화 ──
(async () => {
  await loadData();
  renderAgents();
  renderActions();
  const badge = dataSource === 'api' ? '🟢 DB' : dataSource === 'local' ? '🟡 로컬' : '🔴 폴백';
  document.getElementById('lastSaved').textContent = `데이터 소스: ${badge}`;
})();
</script>
</body>
</html>
