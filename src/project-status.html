<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>프로젝트 현황 — 테넥스</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1a1a2e;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #334155}
.header h1{font-size:20px;font-weight:700}
.header a{color:#8b8ba7;font-size:13px;text-decoration:none;margin-left:auto}
.header a:hover{color:#fff}
.content{max-width:1100px;margin:0 auto;padding:28px 24px 60px}

/* Tabs */
.tab-bar{display:flex;gap:4px;margin-bottom:24px;background:#1e293b;border-radius:10px;padding:4px;border:1px solid #334155}
.tab-btn{padding:10px 20px;border:none;background:transparent;color:#94a3b8;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .2s}
.tab-btn.active{background:#334155;color:#f1f5f9}
.tab-btn:hover:not(.active){color:#cbd5e1}
.tab-content{display:none}
.tab-content.active{display:block}

.section-title{font-size:15px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;margin-top:36px}
.section-title:first-of-type{margin-top:0}

/* 실장 카드 그리드 */
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:8px}
.agent-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;transition:all .2s}
.agent-card:hover{border-color:#002855;box-shadow:0 4px 16px rgba(0,40,85,0.3)}
.agent-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.agent-icon{font-size:22px}
.agent-name{font-size:15px;font-weight:700;color:#f1f5f9}
.agent-role{font-size:11px;color:#64748b;margin-top:2px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0f172a;border-radius:8px;cursor:pointer;transition:background .15s;user-select:none}
.task-item:hover{background:#1e3a5f}
.task-order-btns{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.task-order-btn{background:none;border:1px solid #334155;color:#64748b;font-size:10px;line-height:1;width:20px;height:14px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0}
.task-order-btn:hover{background:#334155;color:#f1f5f9;border-color:#3b82f6}
.task-order-btn:active{background:#3b82f6;color:#fff}
.task-order-btn:disabled{opacity:.2;cursor:default;pointer-events:none}
.task-order-num{min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#64748b;background:#0f172a;border:1px solid #334155;border-radius:6px;cursor:pointer;transition:all .15s;flex-shrink:0;user-select:none}
.task-order-num:hover{border-color:#3b82f6;color:#3b82f6;background:#1e293b}
.task-order-input{width:36px;height:28px;background:#0f172a;border:2px solid #3b82f6;border-radius:6px;color:#f1f5f9;font-size:12px;font-weight:700;text-align:center;outline:none;flex-shrink:0;-moz-appearance:textfield}
.task-order-input::-webkit-outer-spin-button,.task-order-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.task-status{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.task-name{font-size:13px;color:#cbd5e1;flex:1}
.task-item.done .task-name{text-decoration:line-through;color:#475569}
.task-item.delay .task-name{color:#fca5a5}
.task-detail-btn{background:none;border:none;color:#64748b;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px;transition:color .15s}
.task-detail-btn:hover{color:#f1f5f9}

/* 액션 체크리스트 */
/* ── 액션 리스트 v3: 그리드 정렬 ── */
.action-list{display:flex;flex-direction:column;gap:4px}
.action-header-row{display:grid;grid-template-columns:36px 58px 58px 82px 1fr;gap:8px;align-items:center;padding:6px 16px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px}
.action-item{display:grid;grid-template-columns:36px 58px 58px 82px 1fr;gap:8px;align-items:center;padding:10px 16px;background:#1e293b;border:1px solid #334155;border-radius:10px;cursor:pointer;transition:all .15s;user-select:none}
.action-item:hover{border-color:#002855;background:#1e3a5f}
.action-num{font-size:13px;font-weight:800;color:#94a3b8;text-align:center;background:#0f172a;border-radius:6px;padding:4px 0;line-height:1}
/* 업무유형 뱃지 */
.action-type{font-size:10px;font-weight:700;padding:4px 6px;border-radius:5px;text-align:center;white-space:nowrap;letter-spacing:.3px;line-height:1}
.action-type.t-mkt{background:rgba(99,102,241,0.18);color:#818cf8;border:1px solid rgba(99,102,241,0.25)}
.action-type.t-dev{background:rgba(168,85,247,0.18);color:#c084fc;border:1px solid rgba(168,85,247,0.25)}
.action-type.t-cx{background:rgba(16,185,129,0.18);color:#34d399;border:1px solid rgba(16,185,129,0.25)}
.action-type.t-biz{background:rgba(245,158,11,0.18);color:#fbbf24;border:1px solid rgba(245,158,11,0.25)}
.action-type.t-fund{background:rgba(239,68,68,0.18);color:#f87171;border:1px solid rgba(239,68,68,0.25)}
.action-type.t-content{background:rgba(236,72,153,0.18);color:#f472b6;border:1px solid rgba(236,72,153,0.25)}
.action-type.t-hr{background:rgba(45,212,191,0.18);color:#2dd4bf;border:1px solid rgba(45,212,191,0.25)}
/* 상태 뱃지 */
.action-status-badge{font-size:10px;font-weight:700;padding:4px 6px;border-radius:5px;text-align:center;white-space:nowrap;line-height:1}
.action-status-badge.s-doing{background:rgba(59,130,246,0.2);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)}
.action-status-badge.s-done{background:rgba(16,185,129,0.2);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3)}
.action-status-badge.s-delay{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.action-status-badge.s-waiting{background:rgba(100,116,139,0.2);color:#94a3b8;border:1px solid rgba(100,116,139,0.3)}
/* 긴급·중요 셀 */
.action-urgimp{display:flex;gap:3px;align-items:center}
.ui-tag{font-size:10px;font-weight:700;padding:3px 6px;border-radius:4px;line-height:1}
.ui-tag.u-high{background:rgba(239,68,68,0.3);color:#fca5a5;border:1px solid rgba(239,68,68,0.4)}
.ui-tag.u-mid{background:rgba(245,158,11,0.25);color:#fcd34d;border:1px solid rgba(245,158,11,0.35)}
.ui-tag.u-low{background:rgba(100,116,139,0.2);color:#94a3b8;border:1px solid rgba(100,116,139,0.3)}
.ui-tag.i-high{background:rgba(59,130,246,0.25);color:#93c5fd;border:1px solid rgba(59,130,246,0.35)}
.ui-tag.i-mid{background:rgba(59,130,246,0.15);color:#94a3b8;border:1px solid rgba(59,130,246,0.2)}
.ui-tag.i-low{background:rgba(51,65,85,0.4);color:#64748b;border:1px solid rgba(51,65,85,0.5)}
/* 업무명 */
.action-text{font-size:13px;color:#cbd5e1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.action-item.done .action-text{text-decoration:line-through;color:#475569}
.action-item.delay .action-text{color:#fca5a5}
/* 반응형 — 좁은 화면 */
@media(max-width:640px){
.action-header-row,.action-item{grid-template-columns:28px 48px 48px 56px 1fr;gap:4px;padding:8px 10px}
.action-type,.action-status-badge{font-size:9px;padding:3px 4px}
.ui-tag{font-size:8px;padding:1px 3px}
.action-text{font-size:12px}
}

.legend{display:flex;gap:20px;margin-top:20px;padding:12px 16px;background:#1e293b;border-radius:8px;font-size:12px;color:#94a3b8}
.legend span{display:flex;align-items:center;gap:6px}
.last-saved{font-size:11px;color:#475569;margin-top:20px;text-align:right}

/* ── 상세 패널 (슬라이드) ── */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;opacity:0;pointer-events:none;transition:opacity .25s}
.panel-overlay.open{opacity:1;pointer-events:auto}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100vw;background:#1e293b;border-left:1px solid #334155;z-index:501;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;display:flex;flex-direction:column}
.detail-panel.open{transform:translateX(0)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #334155;flex-shrink:0}
.panel-header h2{font-size:16px;font-weight:700;color:#f1f5f9}
.panel-close{background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:color .15s}
.panel-close:hover{color:#fff}
.panel-body{padding:24px;flex:1;display:flex;flex-direction:column;gap:20px}
.panel-field{display:flex;flex-direction:column;gap:6px}
.panel-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.panel-value{font-size:14px;color:#e2e8f0}
.panel-input{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.panel-input:focus{border-color:#3b82f6}
.panel-select{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:13px;outline:none}
.panel-textarea{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:13px;font-family:inherit;outline:none;min-height:80px;resize:vertical;transition:border-color .2s}
.panel-textarea:focus{border-color:#3b82f6}
.panel-row{display:flex;gap:14px}
.panel-row .panel-field{flex:1}
.panel-checklist{display:flex;flex-direction:column;gap:6px}
.panel-check-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f172a;border-radius:8px;cursor:pointer;user-select:none;transition:background .15s}
.panel-check-item:hover{background:#1e3a5f}
.panel-check-item input[type="checkbox"]{accent-color:#3b82f6;width:16px;height:16px;cursor:pointer}
.panel-check-item label{font-size:13px;color:#cbd5e1;cursor:pointer;flex:1}
.panel-check-item.checked label{text-decoration:line-through;color:#475569}
.panel-save-bar{padding:16px 24px;border-top:1px solid #334155;flex-shrink:0;display:flex;gap:10px}
.panel-save-btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.panel-save-btn.primary{background:#3b82f6;color:#fff}
.panel-save-btn.primary:hover{background:#2563eb}
.panel-save-btn.secondary{background:#334155;color:#94a3b8}
.panel-save-btn.secondary:hover{color:#f1f5f9}

/* ── 간트차트 ── */
.gantt-wrap{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden;margin-top:8px}
.gantt-scroll{overflow-x:auto;position:relative}
.gantt-table{border-collapse:collapse;min-width:100%}
.gantt-table th{position:sticky;top:0;background:#1a1a2e;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;padding:10px 8px;border-bottom:1px solid #334155;text-align:center;white-space:nowrap;font-weight:600}
.gantt-table th.task-col{text-align:left;padding-left:16px;min-width:200px;position:sticky;left:0;z-index:2;background:#1a1a2e}
.gantt-table td{padding:0;border-bottom:1px solid rgba(51,65,85,0.5);height:36px;position:relative}
.gantt-table td.task-col{padding:0 16px;font-size:12px;color:#cbd5e1;white-space:nowrap;position:sticky;left:0;z-index:1;background:#1e293b}
.gantt-table tr:hover td{background:rgba(30,58,95,0.3)}
.gantt-table tr:hover td.task-col{background:#1e3a5f}
.gantt-day{width:32px;min-width:32px}
.gantt-today{background:rgba(59,130,246,0.08)}
.gantt-bar{position:absolute;top:6px;bottom:6px;border-radius:4px;min-width:4px;z-index:1}
.gantt-bar.doing{background:#3b82f6}
.gantt-bar.done{background:#10B981}
.gantt-bar.delay{background:#ef4444}
.gantt-bar.waiting{background:#64748b}
.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:#3b82f6;z-index:3;opacity:0.7}
.gantt-month-label{font-size:10px;color:#94a3b8;text-align:center;padding:4px 0}
.gantt-empty{padding:32px;text-align:center;color:#64748b;font-size:13px}
.gantt-legend{display:flex;gap:16px;padding:12px 16px;border-top:1px solid #334155;font-size:11px;color:#94a3b8}
.gantt-legend span{display:flex;align-items:center;gap:6px}
.gantt-legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ── 드래그앤드롭 ── */
.panel-check-item[draggable="true"]{cursor:grab;position:relative}
.panel-check-item.dragging{opacity:.3;background:#334155}
.panel-check-item.drag-over-above{border-top:2px solid #3b82f6;padding-top:6px}
.panel-check-item.drag-over-below{border-bottom:2px solid #3b82f6;padding-bottom:6px}
.drag-handle{color:#475569;font-size:14px;cursor:grab;padding:0 4px;flex-shrink:0;user-select:none;transition:color .15s}
.drag-handle:hover{color:#94a3b8}
.task-item.check-drop-target{background:#1e3a5f !important;border:1px dashed #3b82f6;border-radius:8px;box-shadow:0 0 8px rgba(59,130,246,.3)}
.agent-card.check-drop-target{border-color:#3b82f6 !important;box-shadow:0 4px 16px rgba(59,130,246,.4) !important}
.panel-overlay.drag-through{pointer-events:none}
</style>
</head>
<body>
<div class="header">
  <h1>📋 프로젝트 현황</h1>
  <span style="font-size:12px;color:#64748b;margin-left:8px">상태 클릭으로 변경 · 카드 ▶ 클릭으로 상세보기</span>
  <a href="/index.html">← 보고서 목록</a>
</div>

<div class="content">

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('board')">📋 업무보드</button>
  <button class="tab-btn" onclick="switchTab('gantt')">📊 간트차트</button>
</div>

<!-- Board Tab -->
<div class="tab-content active" id="tab-board">
  <div class="section-title">🤖 실장 업무 현황</div>
  <div class="agent-grid" id="agentGrid"></div>

  <div class="section-title">✅ 태훈 액션 아이템</div>
  <div class="action-header-row">
    <span>#</span><span>유형</span><span>상태</span><span>긴급·중요</span><span>업무명</span>
  </div>
  <div class="action-list" id="actionList"></div>

  <div class="legend" style="flex-wrap:wrap;gap:8px 16px">
    <span style="color:#64748b;font-weight:600">상태:</span>
    <span><span class="action-status-badge s-doing" style="font-size:9px;padding:2px 6px">진행중</span></span>
    <span><span class="action-status-badge s-done" style="font-size:9px;padding:2px 6px">완료</span></span>
    <span><span class="action-status-badge s-delay" style="font-size:9px;padding:2px 6px">지연</span></span>
    <span><span class="action-status-badge s-waiting" style="font-size:9px;padding:2px 6px">대기중</span></span>
    <span style="border-left:1px solid #334155;padding-left:12px;color:#64748b;font-weight:600">긴급:</span>
    <span><span class="ui-tag u-high">긴급</span></span>
    <span><span class="ui-tag u-mid">보통</span></span>
    <span><span class="ui-tag u-low">낮음</span></span>
    <span style="border-left:1px solid #334155;padding-left:12px;color:#64748b;font-weight:600">중요:</span>
    <span><span class="ui-tag i-high">높음</span></span>
    <span><span class="ui-tag i-mid">보통</span></span>
    <span><span class="ui-tag i-low">낮음</span></span>
  </div>
  <div class="last-saved" id="lastSaved"></div>
</div>

<!-- Gantt Tab -->
<div class="tab-content" id="tab-gantt">
  <div class="section-title">📊 프로젝트 타임라인</div>
  <div class="gantt-wrap">
    <div class="gantt-scroll" id="ganttScroll"></div>
    <div class="gantt-legend">
      <span><span class="gantt-legend-dot" style="background:#3b82f6"></span> 진행중</span>
      <span><span class="gantt-legend-dot" style="background:#10B981"></span> 완료</span>
      <span><span class="gantt-legend-dot" style="background:#ef4444"></span> 지연</span>
      <span><span class="gantt-legend-dot" style="background:#64748b"></span> 대기</span>
      <span><span style="display:inline-block;width:2px;height:10px;background:#3b82f6;border-radius:1px"></span> 오늘</span>
    </div>
  </div>
</div>

</div>

<!-- Detail Panel Overlay -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="panel-header">
    <h2 id="panelTitle">태스크 상세</h2>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="panel-field">
      <span class="panel-label">제목</span>
      <input class="panel-input" id="panelName" placeholder="태스크 이름">
    </div>
    <div class="panel-row">
      <div class="panel-field">
        <span class="panel-label">상태</span>
        <select class="panel-select" id="panelStatus">
          <option value="doing">🔧 진행중</option>
          <option value="done">✅ 완료</option>
          <option value="delay">🔴 지연</option>
          <option value="waiting">⏳ 대기</option>
        </select>
      </div>
      <div class="panel-field">
        <span class="panel-label">담당자</span>
        <input class="panel-input" id="panelAssignee" placeholder="담당 실장">
      </div>
    </div>
    <div class="panel-row">
      <div class="panel-field">
        <span class="panel-label">시작일</span>
        <input class="panel-input" id="panelStartDate" type="date">
      </div>
      <div class="panel-field">
        <span class="panel-label">마감일</span>
        <input class="panel-input" id="panelDueDate" type="date">
      </div>
    </div>
    <div class="panel-field">
      <span class="panel-label">설명</span>
      <textarea class="panel-textarea" id="panelDesc" placeholder="태스크 설명..."></textarea>
    </div>
    <div class="panel-field">
      <span class="panel-label">체크리스트</span>
      <div class="panel-checklist" id="panelChecklist"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input class="panel-input" id="newCheckItem" placeholder="새 항목 추가..." style="flex:1" onkeydown="if(event.key==='Enter')addCheckItem()">
        <button onclick="addCheckItem()" style="background:#334155;border:none;color:#94a3b8;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px">+</button>
      </div>
    </div>
  </div>
  <div class="panel-save-bar">
    <button class="panel-save-btn secondary" onclick="closePanel()">취소</button>
    <button class="panel-save-btn primary" onclick="savePanel()">저장</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'tenex-project-status-v1';
const API_READ = '/api/tasks/read';
const API_UPDATE = '/api/tasks/update';

// ── 폴백 데이터 (API 실패 시) ──
const FALLBACK_AGENTS = [
  {id:'개실장', icon:'🔧', name:'개실장', role:'개발실 총괄', tasks:[
    {id:'a1', name:'모사모 강의 통합', status:'done'},
    {id:'a2', name:'앱 탭 UI 통합', status:'doing'},
    {id:'a3', name:'SPA 카테고리 구조', status:'doing'},
    {id:'a4', name:'정품등록 + 메타픽셀', status:'doing'},
    {id:'a5', name:'tenex-reports UI 리뉴얼', status:'done'},
  ]},

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
  if (tab === 'gantt') renderGantt();

// ── 데이터 로드 (API → localStorage → 폴백) ──
async function loadData() {
  try {
    const resp = await fetch(API_READ);
    if (resp.ok) {
      const data = await resp.json();
      if (data.agents && data.agents.length > 0) {
        agents = data.agents;
        actions = FALLBACK_ACTIONS;
        dbTasks = data.tasks || [];
        dataSource = 'api';
        console.log('✅ Supabase에서 로드:', agents.length, 'agents,', dbTasks.length, 'tasks');
        return;
      }
    }
  } catch (e) {
    console.warn('API 로드 실패, 로컬 폴백:', e);
  }

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.agents) {
      agents = FALLBACK_AGENTS.map(a => ({
        ...a,
        tasks: a.tasks.map(t => ({...t, status: saved.tasks?.[t.id] || t.status}))
      }));
      actions = FALLBACK_ACTIONS.map(a => ({...a, status: saved.actions?.[a.id] || a.status}));
      dataSource = 'local';
      return;
    }
  } catch {}

  agents = FALLBACK_AGENTS;
  actions = FALLBACK_ACTIONS;
  dataSource = 'fallback';
}

// ── 저장 (API + localStorage) ──
let saveTimer = null;
function saveData() {
  const taskMap = {};
  agents.forEach(a => a.tasks.forEach(t => { taskMap[t.id] = t.status; }));
  const actMap = {};
  actions.forEach(a => { actMap[a.id] = a.status; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks: taskMap, actions: actMap, agents}));

  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const resp = await fetch(API_UPDATE, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({agents, tasks: dbTasks.length ? dbTasks : undefined})
      });
      if (resp.ok) {
        updateSaveStatus('DB 저장 완료');
      } else {
        updateSaveStatus('DB 저장 실패 (로컬에 저장됨)');
      }
    } catch {
      updateSaveStatus('오프라인 — 로컬에 저장됨');
    }
  }, 300);

  updateSaveStatus('저장 중...');
}

function updateSaveStatus(msg) {
  const el = document.getElementById('lastSaved');
  el.textContent = msg + ' · ' + new Date().toLocaleString('ko-KR');
}

function cycleStatus(current) {
  const idx = STATUS_CYCLE.indexOf(current);
  return STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
}

function startOrderEdit(el, agentId, idx) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;
  const total = agent.tasks.length;
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'task-order-input';
  input.value = idx + 1;
  input.min = 1;
  input.max = total;
  el.replaceWith(input);
  input.focus();
  input.select();

  function commit() {
    let newPos = parseInt(input.value, 10);
    if (isNaN(newPos) || newPos < 1) newPos = 1;
    if (newPos > total) newPos = total;
    const newIdx = newPos - 1;
    if (newIdx !== idx) {
      reorderTask(agentId, idx, newIdx);
    } else {
      renderAgents();
    }
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); renderAgents(); }
  });
}

function reorderTask(agentId, fromIdx, toIdx) {
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;
  const [task] = agent.tasks.splice(fromIdx, 1);
  agent.tasks.splice(toIdx, 0, task);
  saveData();
  renderAgents();
}

function toggleTask(agentId, taskId) {
  agents = agents.map(a => a.id === agentId ? {
    ...a,
    tasks: a.tasks.map(t => t.id === taskId ? {...t, status: cycleStatus(t.status)} : t)
  } : a);
  // dbTasks도 동기화
  const agentTask = agents.find(a => a.id === agentId)?.tasks.find(t => t.id === taskId);
  if (agentTask) {
    const dbIdx = dbTasks.findIndex(t => t.id === taskId);
    if (dbIdx >= 0) dbTasks[dbIdx].status = agentTask.status;
  }
  saveData();
  renderAgents();
}

function toggleAction(actionId) {
  actions = actions.map(a => a.id === actionId ? {...a, status: cycleStatus(a.status)} : a);
  saveData();
  renderActions();
}

// ── Detail Panel ──

  return dbTasks.find(t => t.id === taskId) || null;

function closePanel() {

  panelOpen = false;
  panelAgentId = null;
  panelTaskId = null;

function renderPanelChecklist() {
  const container = document.getElementById('panelChecklist');
  if (!panelChecklist.length) {
    container.innerHTML = '<div style="font-size:12px;color:#475569;padding:8px">체크리스트가 없습니다</div>';
    return;
  }
  container.innerHTML = panelChecklist.map((item, i) => {
    const checked = item.done || item.checked;
    const text = typeof item === 'string' ? item : (item.text || item.label || item);
    return `<div class="panel-check-item ${checked ? 'checked' : ''}" draggable="true"
                data-check-idx="${i}" data-agent-id="${panelAgentId}" data-task-id="${panelTaskId}">
      <span class="drag-handle" title="드래그하여 순서 변경 또는 다른 카드로 이동">⠿</span>
      <input type="checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation();toggleCheckItem(${i})">
      <label onclick="event.stopPropagation();toggleCheckItem(${i})">${text}</label>
    </div>`;
  }).join('');
  initChecklistDrag(container);
}

function toggleCheckItem(idx) {
  if (idx < 0 || idx >= panelChecklist.length) return;
  const item = panelChecklist[idx];
  if (typeof item === 'string') {
    panelChecklist[idx] = {text: item, done: true};
  } else {
    item.done = !item.done;
    item.checked = item.done;
  }
  renderPanelChecklist();
}

function addCheckItem() {
  const input = document.getElementById('newCheckItem');
  const text = input.value.trim();
  if (!text) return;
  panelChecklist.push({text, done: false});
  input.value = '';
  renderPanelChecklist();
}

function savePanel() {
  if (!panelAgentId || !panelTaskId) return;

  const name = document.getElementById('panelName').value.trim();
  const status = document.getElementById('panelStatus').value;
  const assignee = document.getElementById('panelAssignee').value.trim();
  const startDate = document.getElementById('panelStartDate').value;
  const due = document.getElementById('panelDueDate').value;
  const desc = document.getElementById('panelDesc').value.trim();

  // agents 배열 업데이트
  agents = agents.map(a => a.id === panelAgentId ? {
    ...a,
    tasks: a.tasks.map(t => t.id === panelTaskId ? {...t, name: name || t.name, status} : t)
  } : a);

  // dbTasks 업데이트
  const dbIdx = dbTasks.findIndex(t => t.id === panelTaskId);
  if (dbIdx >= 0) {
    dbTasks[dbIdx] = {...dbTasks[dbIdx], title: name, status, assignee, startDate, due, desc, checklist: panelChecklist};
  } else {
    dbTasks.push({id: panelTaskId, title: name, status, assignee, startDate, due, desc, checklist: panelChecklist});
  }

  saveData();
  renderAgents();
  closePanel();
}

// ── 간트차트 ──
function getAllTasksForGantt() {
  const tasks = [];
  // DB tasks 우선
  if (dbTasks.length) {
    dbTasks.forEach(t => {
      if (t.due || t.startDate) {
        tasks.push({
          id: t.id,
          name: t.title || t.name || t.id,
          status: t.status || 'waiting',
          start: t.startDate || t.due,
          end: t.due || t.startDate,
          assignee: t.assignee || ''
        });
      }
    });
  }
  // Agent tasks (DB에 없는 것 + 날짜 있는 것)
  agents.forEach(agent => {
    agent.tasks.forEach(t => {
      if (!tasks.find(x => x.id === t.id)) {
        // DB task에서 날짜 찾기
        const db = findDbTask(t.id);
        const start = db?.startDate || db?.due;
        const end = db?.due || db?.startDate;
        if (start || end) {
          tasks.push({
            id: t.id,
            name: t.name,
            status: t.status,
            start: start || end,
            end: end || start,
            assignee: agent.name
          });
        }
      }
    });
  });
  return tasks;
}

function renderGantt() {
  const container = document.getElementById('ganttScroll');
  const tasks = getAllTasksForGantt();

  if (!tasks.length) {
    // 날짜 없는 agent tasks도 표시 (기본 범위: 현재 월)
    const allTasks = [];
    agents.forEach(agent => {
      agent.tasks.forEach(t => {
        const db = findDbTask(t.id);
        allTasks.push({
          id: t.id,
          name: t.name,
          status: t.status,
          start: db?.startDate || db?.due || null,
          end: db?.due || db?.startDate || null,
          assignee: agent.name
        });
      });
    });

    if (!allTasks.length) {
      container.innerHTML = '<div class="gantt-empty">표시할 태스크가 없습니다</div>';
      return;
    }

    // 날짜 없으면 현재 월 기준으로 표시
    const today = new Date();
    const rangeStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const rangeEnd = new Date(today.getFullYear(), today.getMonth() + 1, 14);
    renderGanttTable(container, allTasks, rangeStart, rangeEnd, today);
    return;
  }

  // 날짜 범위 계산
  const dates = tasks.flatMap(t => [t.start, t.end].filter(Boolean)).map(d => new Date(d));
  const today = new Date();
  dates.push(today);
  const minDate = new Date(Math.min(...dates));
  const maxDate = new Date(Math.max(...dates));
  // 앞뒤 7일 패딩
  const rangeStart = new Date(minDate);
  rangeStart.setDate(rangeStart.getDate() - 7);
  const rangeEnd = new Date(maxDate);
  rangeEnd.setDate(rangeEnd.getDate() + 7);

  renderGanttTable(container, tasks, rangeStart, rangeEnd, today);
}

function renderGanttTable(container, tasks, rangeStart, rangeEnd, today) {
  const days = [];
  const d = new Date(rangeStart);
  while (d <= rangeEnd) {
    days.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }

  const todayStr = today.toISOString().slice(0, 10);
  const todayIdx = days.findIndex(d => d.toISOString().slice(0, 10) === todayStr);

  // Month headers
  const months = [];
  let currentMonth = '';
  days.forEach((day, i) => {
    const m = day.getFullYear() + '-' + String(day.getMonth() + 1).padStart(2, '0');
    if (m !== currentMonth) {
      months.push({label: (day.getMonth() + 1) + '월', start: i, count: 1});
      currentMonth = m;
    } else {
      months[months.length - 1].count++;
    }
  });

  let html = '<table class="gantt-table">';

  // Month row
  html += '<tr><th class="task-col" rowspan="2">태스크</th>';
  months.forEach(m => {
    html += `<th colspan="${m.count}" style="font-size:10px;color:#94a3b8;border-left:1px solid #334155">${m.label}</th>`;
  });
  html += '</tr>';

  // Day row
  html += '<tr>';
  days.forEach((day, i) => {
    const isToday = day.toISOString().slice(0, 10) === todayStr;
    const isWeekend = day.getDay() === 0 || day.getDay() === 6;
    const cls = isToday ? 'gantt-day gantt-today' : 'gantt-day';
    const style = isWeekend ? 'color:#475569' : '';
    html += `<th class="${cls}" style="${style};font-size:10px;font-weight:400">${day.getDate()}</th>`;
  });
  html += '</tr>';

  // Task rows
  tasks.forEach(task => {
    html += '<tr>';
    html += `<td class="task-col">${task.assignee ? '<span style="color:#64748b;font-size:10px">' + task.assignee + '</span> ' : ''}${task.name}</td>`;

    days.forEach((day, i) => {
      const isToday = day.toISOString().slice(0, 10) === todayStr;
      const cls = isToday ? 'gantt-day gantt-today' : 'gantt-day';
      let barHtml = '';

      if (task.start && task.end) {
        const dayStr = day.toISOString().slice(0, 10);
        if (dayStr === task.start) {
          // Calculate bar width
          const startIdx = i;
          const endD = new Date(task.end);
          const endIdx = days.findIndex(x => x.toISOString().slice(0, 10) === task.end);
          const span = endIdx >= startIdx ? (endIdx - startIdx + 1) : 1;
          barHtml = `<div class="gantt-bar ${task.status}" style="left:2px;width:${span * 32 - 4}px"></div>`;
        }
      }

      // Today line
      let todayLine = '';
      if (isToday) {
        todayLine = '<div class="gantt-today-line" style="left:50%"></div>';
      }

      html += `<td class="${cls}">${barHtml}${todayLine}</td>`;
    });
    html += '</tr>';
  });

  html += '</table>';
  container.innerHTML = html;

  // Scroll to today
  if (todayIdx > 0) {
    container.scrollLeft = Math.max(0, todayIdx * 32 - container.clientWidth / 2);
  }
}

// ── 체크리스트 드래그앤드롭 (패널 내 순서 변경) ──
let dragCheckIdx = null;
let dragCheckAgentId = null;
let dragCheckTaskId = null;

function initChecklistDrag(container) {
  container.querySelectorAll('.panel-check-item[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragCheckIdx = parseInt(el.dataset.checkIdx);
      dragCheckAgentId = el.dataset.agentId;
      dragCheckTaskId = el.dataset.taskId;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', JSON.stringify({
        type: 'checklist-item',
        idx: dragCheckIdx,
        agentId: dragCheckAgentId,
        taskId: dragCheckTaskId
      }));
      // 패널 밖 드래그 시 task 카드가 드롭 대상이 되도록
      setTimeout(() => enableCardDropTargets(), 0);
    });

    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      dragCheckIdx = null;
      clearAllDropHighlights();
      disableCardDropTargets();
    });

    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = el.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      container.querySelectorAll('.panel-check-item').forEach(x => {
        x.classList.remove('drag-over-above', 'drag-over-below');
      });
      if (e.clientY < midY) {
        el.classList.add('drag-over-above');
      } else {
        el.classList.add('drag-over-below');
      }
    });

    el.addEventListener('dragleave', () => {
      el.classList.remove('drag-over-above', 'drag-over-below');
    });

    el.addEventListener('drop', e => {
      e.preventDefault();
      const targetIdx = parseInt(el.dataset.checkIdx);
      const rect = el.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      let insertIdx = e.clientY < midY ? targetIdx : targetIdx + 1;

      container.querySelectorAll('.panel-check-item').forEach(x => {
        x.classList.remove('drag-over-above', 'drag-over-below');
      });

      if (dragCheckIdx === null || dragCheckIdx === insertIdx || dragCheckIdx + 1 === insertIdx) {
        return; // no-op
      }

      // 같은 카드 내 순서 변경
      const [item] = panelChecklist.splice(dragCheckIdx, 1);
      const adjustedIdx = insertIdx > dragCheckIdx ? insertIdx - 1 : insertIdx;
      panelChecklist.splice(adjustedIdx, 0, item);
      renderPanelChecklist();
    });
  });
}

// ── 카드 간 체크리스트 이동 (패널 밖 → 다른 task 카드로 드롭) ──
function enableCardDropTargets() {
  document.querySelectorAll('.task-item').forEach(taskEl => {
    taskEl.addEventListener('dragover', cardDragOver);
    taskEl.addEventListener('dragleave', cardDragLeave);
    taskEl.addEventListener('drop', cardDrop);
  });
  // 패널 오버레이가 드래그를 막지 않도록
  document.getElementById('panelOverlay')?.classList.add('drag-through');
}

function disableCardDropTargets() {
  document.querySelectorAll('.task-item').forEach(taskEl => {
    taskEl.removeEventListener('dragover', cardDragOver);
    taskEl.removeEventListener('dragleave', cardDragLeave);
    taskEl.removeEventListener('drop', cardDrop);
    taskEl.classList.remove('check-drop-target');
  });
  document.getElementById('panelOverlay')?.classList.remove('drag-through');
}

function cardDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('check-drop-target');
}

function cardDragLeave(e) {
  this.classList.remove('check-drop-target');
}

function cardDrop(e) {
  e.preventDefault();
  this.classList.remove('check-drop-target');

  let data;
  try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  if (data.type !== 'checklist-item') return;

  // 드롭 대상 task 찾기
  const taskItem = this.closest('.task-item');
  if (!taskItem) return;

  // task-item에서 agentId, taskId 추출 (onclick 속성에서 파싱)
  const detailBtn = taskItem.querySelector('.task-detail-btn');
  if (!detailBtn) return;
  const onclickStr = detailBtn.getAttribute('onclick') || '';
  const match = onclickStr.match(/openPanel\('([^']+)','([^']+)'\)/);
  if (!match) return;
  const targetAgentId = match[1];
  const targetTaskId = match[2];

  // 같은 카드면 무시
  if (targetAgentId === data.agentId && targetTaskId === data.taskId) return;

  // 원본 체크리스트에서 항목 제거
  const srcItem = panelChecklist[data.idx];
  if (!srcItem) return;

  panelChecklist.splice(data.idx, 1);

  // 원본 DB task 체크리스트 업데이트
  const srcDb = dbTasks.find(t => t.id === data.taskId);
  if (srcDb) {
    srcDb.checklist = [...panelChecklist];
  }

  // 대상 DB task 체크리스트에 추가
  let destDb = dbTasks.find(t => t.id === targetTaskId);
  if (!destDb) {
    destDb = {id: targetTaskId, checklist: []};
    dbTasks.push(destDb);
  }
  if (!destDb.checklist) destDb.checklist = [];
  destDb.checklist.push(srcItem);

  saveData();
  renderPanelChecklist();

  // 이동 완료 토스트
  showToast(`체크리스트 항목을 ${targetAgentId}의 다른 카드로 이동했습니다`);
}

function clearAllDropHighlights() {
  document.querySelectorAll('.drag-over-above,.drag-over-below,.check-drop-target').forEach(el => {
    el.classList.remove('drag-over-above', 'drag-over-below', 'check-drop-target');
  });
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#334155;color:#f1f5f9;padding:12px 24px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .3s';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
}

// ── 초기화 ──
(async () => {
  await loadData();
  renderAgents();
  renderActions();
  const badge = dataSource === 'api' ? '🟢 DB' : dataSource === 'local' ? '🟡 로컬' : '🔴 폴백';
  document.getElementById('lastSaved').textContent = `데이터 소스: ${badge}`;
})();
</script>
