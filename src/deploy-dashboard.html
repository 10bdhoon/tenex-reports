<!DOCTYPE html>
<html lang="ko">
<head><script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>배포 현황 — Tenex</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0}
.header{background:#1a1a2e;color:#fff;padding:24px 32px;display:flex;align-items:center;gap:16px}
.header h1{font-size:24px;font-weight:700}
.header a{color:#8b8ba7;font-size:13px;text-decoration:none}
.header a:hover{color:#fff}
.content{max-width:1100px;margin:24px auto;padding:0 16px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:32px}
.sum-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;text-align:center}
.sum-card .num{font-size:28px;font-weight:800}
.sum-card .num.navy{color:#002855}
.sum-card .num.green{color:#16A34A}
.sum-card .label{font-size:12px;color:#94a3b8;margin-top:4px}

h2{color:#5b9bd5;font-size:18px;margin:32px 0 16px;font-weight:700}

.deploy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:20px;margin-bottom:32px}
.deploy-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:24px;transition:border-color .2s}
.deploy-card:hover{border-color:#002855}
.deploy-card .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.deploy-card .site-name{font-size:18px;font-weight:700;color:#f1f5f9}
.deploy-card .site-icon{font-size:28px}

.status-badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700}
.status-badge.ok{background:#064e3b;color:#34d399}
.status-badge.error{background:#7f1d1d;color:#fca5a5}

.deploy-card .info-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:#94a3b8}
.deploy-card .info-row .label{min-width:80px;color:#64748b;font-weight:600}
.deploy-card .info-row a{color:#60a5fa;text-decoration:none}
.deploy-card .info-row a:hover{text-decoration:underline}

.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.tag.navy{background:#001a3a;color:#5b9bd5}
.tag.green{background:#052e16;color:#4ade80}
.tag.blue{background:#1e3a5f;color:#60a5fa}

.deploy-time{font-size:11px;color:#64748b;margin-top:12px;padding-top:12px;border-top:1px solid #334155}

@media(max-width:640px){
  .header{padding:16px;flex-wrap:wrap}
  .content{padding:0 8px}
  .deploy-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header"><h1>🚀 배포 현황</h1><a href="index.html">← 보고서 목록</a></div>

<div class="content">

<div class="summary">
  <div class="sum-card"><div class="num navy">2</div><div class="label">전체 사이트</div></div>
  <div class="sum-card"><div class="num green">2</div><div class="label">정상</div></div>
</div>

<h2>🌐 배포 사이트</h2>
<div class="deploy-grid">

  <div class="deploy-card">
    <div class="card-header">
      <div class="site-name">tenex-reports</div>
      <div class="site-icon">📄</div>
    </div>
    <div class="info-row"><span class="label">URL</span><a href="https://tenex-reports.vercel.app" target="_blank">tenex-reports.vercel.app</a></div>
    <div class="info-row"><span class="label">상태</span><span class="status-badge ok">정상</span></div>
    <div class="info-row"><span class="label">프레임워크</span><span class="tag navy">정적 HTML</span></div>
    <div class="info-row"><span class="label">플랫폼</span><span class="tag green">Vercel</span></div>
    <div class="deploy-time">마지막 배포: <span id="deploy-time-1"></span></div>
  </div>

  <div class="deploy-card">
    <div class="card-header">
      <div class="site-name">tenex-dashboard</div>
      <div class="site-icon">📊</div>
    </div>
    <div class="info-row"><span class="label">URL</span><a href="https://tenex-dashboard.vercel.app" target="_blank">tenex-dashboard.vercel.app</a></div>
    <div class="info-row"><span class="label">상태</span><span class="status-badge ok">정상</span></div>
    <div class="info-row"><span class="label">프레임워크</span><span class="tag blue">Next.js 16</span></div>
    <div class="info-row"><span class="label">플랫폼</span><span class="tag green">Vercel</span></div>
    <div class="deploy-time">마지막 배포: <span id="deploy-time-2"></span></div>
  </div>

</div>

<p style="text-align:center;color:#64748b;font-size:12px;margin:40px 0 20px">최종 업데이트: 2026-03-27</p>
</div>

<script>
const now = new Date();
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
document.getElementById('deploy-time-1').textContent = fmt(now);
document.getElementById('deploy-time-2').textContent = fmt(now);
</script>
</body>
</html>
