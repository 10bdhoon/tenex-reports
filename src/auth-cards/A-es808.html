<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINEMEDICAL — 정품인증 카드 (ES-808)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e17;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .card{width:428px;height:270px;border-radius:16px;background:linear-gradient(145deg,#002855 0%,#001a3a 50%,#002855 100%);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 1px rgba(201,168,76,.3);border:1px solid rgba(201,168,76,.15)}
  .card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(201,168,76,.03) 45%,rgba(201,168,76,.06) 50%,rgba(201,168,76,.03) 55%,transparent 60%);animation:shimmer 6s ease-in-out infinite}
  @keyframes shimmer{0%,100%{transform:translateX(-30%) translateY(-30%)}50%{transform:translateX(30%) translateY(30%)}}
  .card-inner{position:relative;z-index:2;height:100%;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start}
  .logo{font-size:13px;font-weight:800;letter-spacing:4px;color:#C9A84C;text-shadow:0 0 20px rgba(201,168,76,.2)}
  .verified{display:flex;align-items:center;gap:5px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:20px;padding:4px 12px;font-size:10px;color:#C9A84C;font-weight:600;letter-spacing:1px}
  .verified svg{width:12px;height:12px;fill:#C9A84C}
  .mid-row{display:flex;align-items:center;gap:24px}
  .product-wrap{width:120px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.05)}
  .product-wrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
  .product-info h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px;letter-spacing:.5px}
  .product-info .model{font-size:11px;color:rgba(201,168,76,.7);letter-spacing:2px;font-weight:600;margin-bottom:8px}
  .product-info .desc{font-size:11px;color:rgba(255,255,255,.4);line-height:1.4}
  .bottom-row{display:flex;justify-content:space-between;align-items:flex-end}
  .warranty{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px}
  .warranty span{color:rgba(201,168,76,.6);font-weight:600}
  .emboss{font-size:10px;color:rgba(201,168,76,.2);letter-spacing:6px;font-weight:700}
  .foil-line{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),rgba(201,168,76,.5),rgba(201,168,76,.3),transparent)}
  .corner-mark{position:absolute;width:24px;height:24px;border-color:rgba(201,168,76,.1);border-style:solid}
  .corner-tl{top:16px;left:16px;border-width:1px 0 0 1px;border-radius:4px 0 0 0}
  .corner-br{bottom:16px;right:16px;border-width:0 1px 1px 0;border-radius:0 0 4px 0}
</style>
</head>
<body>
<div class="card">
  <div class="corner-mark corner-tl"></div>
  <div class="corner-mark corner-br"></div>
  <div class="card-inner">
    <div class="top-row">
      <div class="logo">KINEMEDICAL</div>
      <div class="verified">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z"/></svg>
        VERIFIED AUTHENTIC
      </div>
    </div>
    <div class="mid-row">
      <div class="product-wrap">
        <img src="images/es-808-detail.png" alt="ES-808">
      </div>
      <div class="product-info">
        <h2>ES-808</h2>
        <div class="model">MODEL NO. ES-808-KR</div>
        <div class="desc">전기자극 치료기<br>Electrical Stimulator</div>
      </div>
    </div>
    <div class="bottom-row">
      <div class="warranty">보증기간 <span>6개월</span> · WARRANTY</div>
      <div class="emboss">AUTHENTIC</div>
    </div>
  </div>
  <div class="foil-line"></div>
</div>
</body>
</html>
