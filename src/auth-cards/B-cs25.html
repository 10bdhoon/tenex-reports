<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINEMEDICAL — NFC 인증카드 (CS-25)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#08080c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .card{width:400px;border-radius:20px;background:linear-gradient(160deg,#0f1119 0%,#161822 40%,#0f1119 100%);border:1px solid rgba(255,255,255,.08);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.6);position:relative}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:conic-gradient(from 0deg at 50% 50%,transparent 0deg,rgba(100,200,255,.04) 60deg,transparent 120deg,rgba(200,100,255,.04) 200deg,transparent 280deg,rgba(100,255,200,.04) 340deg,transparent 360deg);animation:holoRotate 8s linear infinite}
  @keyframes holoRotate{to{transform:rotate(360deg)}}
  .holo-stripe{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff006640,#00ff9940,#0066ff40,#ff006640);background-size:200% 100%;animation:holoSlide 3s linear infinite}
  @keyframes holoSlide{to{background-position:200% 0}}
  .card-inner{position:relative;z-index:2;padding:28px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .logo{font-size:12px;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.7)}
  .nfc-badge{display:flex;align-items:center;gap:6px;font-size:10px;color:#00d4aa;font-weight:700;letter-spacing:1px}
  .nfc-icon{width:20px;height:20px;border:2px solid #00d4aa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#00d4aa}
  .product-area{display:flex;align-items:center;gap:20px;margin-bottom:24px}
  .product-img{width:130px;height:100px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(0,100,255,.15));border-radius:12px}
  .product-detail h2{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
  .product-detail .model-tag{font-size:10px;color:#00d4aa;background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.2);padding:2px 10px;border-radius:12px;display:inline-block;margin-bottom:8px;font-weight:600;letter-spacing:1px}
  .product-detail .desc{font-size:11px;color:rgba(255,255,255,.35);line-height:1.5}
  .serial-area{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .serial-label{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:2px;font-weight:600;margin-bottom:4px}
  .serial-code{font-size:13px;font-family:'SF Mono',monospace;color:rgba(255,255,255,.6);letter-spacing:3px;font-weight:600}
  .qr-placeholder{width:52px;height:52px;border:1px solid rgba(255,255,255,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.02)}
  .qr-placeholder svg{width:28px;height:28px;fill:rgba(255,255,255,.15)}
  .verified-bar{display:flex;align-items:center;gap:8px;padding:10px 0 0}
  .v-dot{width:8px;height:8px;border-radius:50%;background:#00d4aa;box-shadow:0 0 8px rgba(0,212,170,.4);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .v-text{font-size:11px;color:rgba(255,255,255,.4);font-weight:500}
  .v-text span{color:#00d4aa;font-weight:700}
  .warranty-info{margin-left:auto;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <div class="holo-stripe"></div>
  <div class="card-inner">
    <div class="top">
      <div class="logo">KINEMEDICAL</div>
      <div class="nfc-badge"><div class="nfc-icon">N</div>NFC VERIFIED</div>
    </div>
    <div class="product-area">
      <img class="product-img" src="images/cs-25-detail.png" alt="CS-25">
      <div class="product-detail">
        <h2>CS-25</h2>
        <div class="model-tag">AUTHENTIC DEVICE</div>
        <div class="desc">도수치료 시뮬레이터<br>Cervical Spine Therapy</div>
      </div>
    </div>
    <div class="serial-area">
      <div>
        <div class="serial-label">SERIAL NUMBER</div>
        <div class="serial-code">KM-CS25-2026-04A7</div>
      </div>
      <div class="qr-placeholder">
        <svg viewBox="0 0 24 24"><path d="M3 11h2v2H3v-2zm0-4h2v2H3V7zm4 4h2v2H7v-2zm0-4h2v2H7V7zm-4 8h2v2H3v-2zm8-8h2v2h-2V7zm-4 8h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm0-4h2v2h-2v-2zm0-4h2v2h-2V7zm4 4h2v2h-2v-2zm0-4h2v2h-2V7zm0 8h2v2h-2v-2z"/></svg>
      </div>
    </div>
    <div class="verified-bar">
      <div class="v-dot"></div>
      <div class="v-text"><span>Verified</span> · 정품 인증 완료</div>
      <div class="warranty-info">보증 6개월</div>
    </div>
  </div>
</div>
</body>
</html>
