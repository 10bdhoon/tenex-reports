<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>앱 종합 — 테넥스</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.back{display:inline-block;padding:10px 20px;font-size:12px;color:#58a6ff;text-decoration:none;background:#161b22;border-bottom:1px solid #21262d}
.back:hover{color:#79c0ff;text-decoration:underline}
.tab-nav{position:sticky;top:0;z-index:100;background:#161b22;border-bottom:1px solid #21262d;display:flex;overflow-x:auto;padding:0 20px}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:#8b949e;padding:14px 20px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn:hover{color:#e6edf3}
.tab-btn.active{color:#e6edf3;border-bottom-color:#58a6ff}
.tab-pane{display:none;flex:1}
.tab-pane.active{display:flex;flex-direction:column}
.embed-frame{width:100%;flex:1;min-height:calc(100vh - 100px);border:none;background:#0d1117}
.badge{position:fixed;bottom:16px;right:16px;background:rgba(0,0,0,0.7);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;line-height:1.8;z-index:9999}
.badge span{opacity:.6}
</style>
</head>
<body>
<a class="back" href="index.html">← 허브로 돌아가기</a>
<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('overview',this)">📱 앱 개요</button>
  <button class="tab-btn" onclick="showTab('tech',this)">🔧 기술 스펙</button>
  <button class="tab-btn" onclick="showTab('journey',this)">🗺️ 여정 계획</button>
  <button class="tab-btn" onclick="showTab('kine',this)">📋 키네메디칼 앱</button>
</nav>

<div id="tab-overview" class="tab-pane active">
  <iframe class="embed-frame" src="1min-dosu-app.html" loading="lazy"></iframe>
</div>
<div id="tab-tech" class="tab-pane">
  <iframe class="embed-frame" src="app-tech-spec.html" loading="lazy"></iframe>
</div>
<div id="tab-journey" class="tab-pane">
  <iframe class="embed-frame" src="app-journey-plan.html" loading="lazy"></iframe>
</div>
<div id="tab-kine" class="tab-pane">
  <iframe class="embed-frame" src="kinemedical-app.html" loading="lazy"></iframe>
</div>

<div class="badge">
  <span>작성</span> 2026-03 &nbsp;|&nbsp; <span>수정</span> 2026-03-31 &nbsp;|&nbsp; 통합 문서
</div>

<script>
function showTab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
