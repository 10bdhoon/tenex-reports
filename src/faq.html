<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자주 묻는 질문 — 키네메디칼</title>
<meta name="description" content="키네메디칼 CS-25, ES-808, WS-200 자주 묻는 질문. 사용법, 배송, 교환/환불, A/S 안내.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#16161f;--bg4:#1e1e2a;
  --border:#1e1e2e;--border2:#2a2a3a;
  --text:#e8e8f0;--text2:#a0a0b8;--text3:#6b6b80;
  --accent:#60a5fa;--accent2:#3b82f6;
  --green:#22c55e;--green-bg:rgba(34,197,94,0.06);--green-border:rgba(34,197,94,0.18);
  --red:#f87171;--orange:#f59e0b;--purple:#a78bfa;--teal:#2dd4bf;
  --cs25:#f87171;--es808:#60a5fa;--ws200:#fbbf24;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent2);color:#fff}

/* Header */
.header{background:linear-gradient(135deg,#0a0a0f 0%,#0f1729 50%,#0a0a0f 100%);border-bottom:1px solid var(--border);padding:48px 24px 36px;text-align:center}
.header-top{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.header-brand{font-size:12px;font-weight:700;color:var(--green);letter-spacing:0.05em}
.header-sep{color:var(--border2);font-size:12px}
.header-sub{font-size:12px;color:var(--text3)}
.header h1{font-size:28px;font-weight:800;color:#fff;margin-bottom:10px;letter-spacing:-0.5px}
.header p{font-size:14px;color:var(--text2);max-width:480px;margin:0 auto;line-height:1.6}
.trust-bar{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.trust-item .num{color:var(--green);font-weight:700}

/* Search */
.search-wrap{max-width:640px;margin:-22px auto 0;padding:0 24px;position:relative;z-index:10}
.search-box{position:relative}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:14px 16px 14px 46px;font-size:15px;color:var(--text);outline:none;transition:all 0.2s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,165,250,0.12)}
.search-count{text-align:center;margin-top:10px;font-size:12px;color:var(--text3)}

/* Filters */
.filters{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;padding:0 24px}
.filter-btn{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:rgba(96,165,250,0.1);border-color:var(--accent);color:var(--accent)}
.filter-btn[data-filter="cs25"].active{background:rgba(248,113,113,0.1);border-color:var(--cs25);color:var(--cs25)}
.filter-btn[data-filter="es808"].active{background:rgba(96,165,250,0.1);border-color:var(--es808);color:var(--es808)}
.filter-btn[data-filter="ws200"].active{background:rgba(251,191,36,0.1);border-color:var(--ws200);color:var(--ws200)}
.filter-btn[data-filter="order"].active{background:rgba(45,212,191,0.1);border-color:var(--teal);color:var(--teal)}
.filter-btn[data-filter="as"].active{background:rgba(167,139,250,0.1);border-color:var(--purple);color:var(--purple)}

/* Content */
.content{max-width:720px;margin:32px auto;padding:0 24px 80px}

/* Category */
.category{margin-bottom:36px}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.cat-title{font-size:15px;font-weight:700;color:#fff}
.cat-count{background:var(--bg3);color:var(--text3);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}

/* FAQ Items */
.faq-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color 0.15s}
.faq-item:hover{border-color:var(--border2)}
.faq-item.open{border-color:var(--border2)}
.faq-q{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
.faq-q:hover{background:rgba(255,255,255,0.015)}
.faq-arrow{color:var(--text3);font-size:11px;margin-top:4px;transition:transform 0.2s;flex-shrink:0;width:14px;text-align:center}
.faq-item.open .faq-arrow{transform:rotate(90deg);color:var(--accent)}
.faq-q-text{font-size:14px;font-weight:600;color:var(--text);flex:1;line-height:1.5}
.faq-tags{display:flex;gap:4px;flex-shrink:0;margin-top:2px}
.faq-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:0.02em}
.faq-tag.cs25{background:rgba(248,113,113,0.1);color:var(--cs25)}
.faq-tag.es808{background:rgba(96,165,250,0.1);color:var(--es808)}
.faq-tag.ws200{background:rgba(251,191,36,0.1);color:var(--ws200)}
.faq-tag.order{background:rgba(45,212,191,0.1);color:var(--teal)}
.faq-tag.as{background:rgba(167,139,250,0.1);color:var(--purple)}
.faq-a{display:none;padding:0 18px 18px 44px;font-size:13px;color:var(--text2);line-height:1.8}
.faq-item.open .faq-a{display:block}
.faq-a p{margin-bottom:10px}
.faq-a strong{color:var(--text);font-weight:600}
.faq-a ul,.faq-a ol{margin:8px 0;padding-left:18px}
.faq-a li{margin-bottom:5px}
.faq-a .tip{background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:12px;color:var(--green);line-height:1.6}
.faq-a .warn{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.18);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:12px;color:var(--orange);line-height:1.6}
.faq-a .danger{background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.18);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:12px;color:var(--red);line-height:1.6}
.faq-a .contact{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:12px;color:var(--text2);line-height:1.7}
.faq-a .contact strong{color:var(--accent)}
.faq-a table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.faq-a th{padding:8px 10px;text-align:left;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border)}
.faq-a td{padding:8px 10px;border-bottom:1px solid var(--border)}

/* CTA */
.cta-box{background:linear-gradient(135deg,#0f1729 0%,#111118 100%);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center;margin-top:40px}
.cta-box h3{font-size:16px;font-weight:700;color:#fff;margin-bottom:8px}
.cta-box p{font-size:13px;color:var(--text2);margin-bottom:16px}
.cta-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cta-link{display:inline-flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;transition:all 0.15s}
.cta-link:hover{border-color:var(--accent);color:var(--accent)}

/* No Results */
.no-results{text-align:center;padding:60px 20px;color:var(--text3)}
.no-results .icon{font-size:48px;margin-bottom:12px}
.no-results p{font-size:14px}

/* Footer */
.footer{text-align:center;padding:24px;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}

/* Mobile */
@media(max-width:640px){
  .header{padding:36px 20px 28px}
  .header h1{font-size:22px}
  .trust-bar{gap:14px}
  .faq-q{padding:14px 14px}
  .faq-a{padding:0 14px 14px 38px}
  .faq-tags{display:none}
}
</style>
</head>

// ── Render logic ──
var cats = [
  "사용법 · CS-25","사용법 · ES-808","사용법 · WS-200",
  "통합 사용 · 제품 선택","안전 · 주의사항",
  "가격 · 결제","주문 · 배송","교환 · 환불","A/S · 고장","브랜드 · 기타"
];
var tagLabels = {cs25:"CS-25",es808:"ES-808",ws200:"WS-200",order:"주문",as:"A/S"};
var contentEl = document.getElementById("content");
var searchInput = document.getElementById("searchInput");
var searchCount = document.getElementById("searchCount");

function renderFAQ(items, query) {
  contentEl.querySelectorAll(".category,.no-results,.cta-box").forEach(function(el){el.remove()});

  if (items.length === 0) {
    var noRes = document.createElement("div");
    noRes.className = "no-results";
    noRes.innerHTML = '<div class="icon">🔍</div><p>검색 결과가 없습니다.<br>다른 키워드로 검색해보세요.</p>';
    contentEl.appendChild(noRes);
    searchCount.textContent = "0개의 결과";
    return;
  }

  searchCount.textContent = items.length + "개의 질문";

  cats.forEach(function(cat) {
    var catItems = items.filter(function(f){return f.cat === cat});
    if (catItems.length === 0) return;

    var catDiv = document.createElement("div");
    catDiv.className = "category";
    catDiv.innerHTML = '<div class="cat-header"><span class="cat-title">' + cat + '</span><span class="cat-count">' + catItems.length + '</span></div>';

    catItems.forEach(function(item) {
      var div = document.createElement("div");
      div.className = "faq-item";
      div.setAttribute("data-tags", item.tags.join(" "));

      var tagsHtml = item.tags.map(function(t){return '<span class="faq-tag '+t+'">'+tagLabels[t]+'</span>'}).join("");

      div.innerHTML = '<div class="faq-q"><span class="faq-arrow">▶</span><span class="faq-q-text">' + hl(item.q, query) + '</span><span class="faq-tags">' + tagsHtml + '</span></div><div class="faq-a">' + item.a + '</div>';

      div.querySelector(".faq-q").addEventListener("click", function(){
        div.classList.toggle("open");
      });

      catDiv.appendChild(div);
    });

    contentEl.appendChild(catDiv);
  });

  // CTA box
  var cta = document.createElement("div");
  cta.className = "cta-box";
  cta.innerHTML = '<h3>찾으시는 답변이 없으신가요?</h3><p><a href="https://pf.kakao.com/_CwrSn" target="_blank" style="color:var(--accent);font-weight:600">카카오톡 플러스친구 💬</a>로 문의해주시면 빠르게 도움드리겠습니다.</p><div class="cta-links"><a class="cta-link" href="https://pf.kakao.com/_CwrSn" target="_blank">💬 카카오톡 문의하기</a><a class="cta-link" href="https://www.youtube.com/@1%EB%B6%84%EB%8F%84%EC%88%98" target="_blank">📺 사용법 영상 보기</a><a class="cta-link" href="https://kinemedical.co.kr" target="_blank">🛒 자사몰 바로가기</a></div>';
  contentEl.appendChild(cta);
}

function hl(text, query) {
  if (!query) return text;
  var words = query.trim().split(/\s+/).filter(function(w){return w.length > 0});
  words.forEach(function(w){
    var re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", "gi");
    text = text.replace(re, '<mark style="background:rgba(96,165,250,0.2);color:var(--accent);border-radius:2px;padding:0 1px">$1</mark>');
  });
  return text;
}

function filterItems() {
  var query = searchInput.value.toLowerCase().trim();
  var activeFilter = document.querySelector(".filter-btn.active").getAttribute("data-filter");

  var filtered = faqData.filter(function(item) {
    if (activeFilter !== "all") {
      if (item.tags.indexOf(activeFilter) === -1) return false;
    }
    if (query) {
      var searchText = (item.q + " " + item.keywords + " " + item.cat).toLowerCase();
      var words = query.split(/\s+/);
      return words.every(function(w){return searchText.indexOf(w) !== -1});
    }
    return true;
  });

  renderFAQ(filtered, query);
}

document.querySelectorAll(".filter-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active")});
    btn.classList.add("active");
    filterItems();
  });
});

searchInput.addEventListener("input", function(){ filterItems(); });

renderFAQ(faqData, "");
</script>
